[project]
name = "patchloop"
version = "0.1.0"
description = "A bounded issue-to-patch agent for GitHub Actions"
requires-python = ">=3.12"
dependencies = [
  "langchain-google-genai>=4,<5",
  "langgraph>=1.0.8,<2",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
patchloop = "patchloop.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "types-PyYAML>=6.0.12.20250822,<7",
]

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises a real external runtime such as Docker",
  "smoke: explicitly exercises a live external provider",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["patchloop"]

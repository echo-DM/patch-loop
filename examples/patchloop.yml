version: 1
model: gemini-3.5-flash-lite
verifier:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  setup:
    - uv --version
  checks:
    - UV_CACHE_DIR=/tmp/uv-cache UV_PROJECT_ENVIRONMENT=/tmp/patchloop-venv uv run --frozen pytest -q
  limits:
    timeout_seconds: 300
    memory_mb: 1024
    pids: 256
    output_bytes: 200000
budgets:
  max_iterations: 3
  max_tool_calls: 60
  max_changed_files: 2
  max_diff_lines: 300
  max_wall_time_minutes: 10

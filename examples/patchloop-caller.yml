name: PatchLoop

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: patchloop-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  patchloop:
    if: github.event.label.name == 'patchloop'
    uses: echo-DM/patch-loop/.github/workflows/patchloop-reusable.yml@v0.1.0
    with:
      event_json: ${{ toJson(github.event) }}
      config_path: .patchloop.yml
    secrets:
      gemini_api_key: ${{ secrets.PATCHLOOP_GEMINI_API_KEY }}

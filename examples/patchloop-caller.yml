name: PatchLoop

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: patchloop-caller-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.label.name == 'patchloop'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.readiness.outputs.enabled }}
    steps:
      - name: Check credential presence
        id: readiness
        env:
          PATCHLOOP_HAS_GEMINI_KEY: ${{ secrets.PATCHLOOP_GEMINI_API_KEY != '' }}
        run: |
          if [ "$PATCHLOOP_HAS_GEMINI_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  patchloop:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    uses: echo-DM/patch-loop/.github/workflows/patchloop-reusable.yml@00e292cf4e52807182b5574f1998f2003a463283
    with:
      config_path: .patchloop.yml
    secrets:
      gemini_api_key: ${{ secrets.PATCHLOOP_GEMINI_API_KEY }}

version: 1
model: gemini-3.5-flash-lite
verifier:
  image: alpine:3.22
  setup:
    - test -f README.md
  checks:
    - "grep -Fxq 'Release smoke fixture: passed.' README.md"
  limits:
    timeout_seconds: 60
    memory_mb: 128
    pids: 64
    output_bytes: 20000
budgets:
  max_iterations: 2
  max_tool_calls: 20
  max_changed_files: 1
  max_diff_lines: 40
  max_wall_time_minutes: 10

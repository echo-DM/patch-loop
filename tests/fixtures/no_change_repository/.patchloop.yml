version: 1
model: gemma-4-31b-it
verifier:
  image: python:3.12-slim
  setup:
    - uv sync --frozen
  checks:
    - uv run pytest
  limits:
    timeout_seconds: 300
    memory_mb: 512
    pids: 64
    output_bytes: 65536
budgets:
  max_iterations: 3
  max_tool_calls: 60
  max_changed_files: 20
  max_diff_lines: 2000
  max_wall_time_minutes: 30
